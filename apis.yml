name: Herald
kind: company
description: Herald builds digital infrastructure for commercial insurance, providing
  a single unified REST API that lets software platforms quote and bind across many
  carriers and lines of business. Developers create applications, submit them to
  carriers, and receive normalized quotes, products, classifications, and files
  through one integration secured with OAuth2 client-credentials bearer tokens.
